<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090a">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>TV04 · the console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   TV04 · the console
   The swing. He wants more on the screen without it turning into a wall.
   The answer is not smaller cards, it is NO cards: a broadsheet. Hairline rules
   and column gutters instead of boxes, because a box costs padding on four sides
   and a rule costs one pixel. Six columns, each with a DIFFERENT rhythm, so the
   eye can tell them apart without reading: a lead, a ladder, a rail, a ledger,
   a list, a strip. Every list caps itself and says how many it hid.
   Typography clamps against viewport HEIGHT, because a 16:9 TV runs out of
   height long before it runs out of width.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --ground:#08090a; --rule:#1c2023; --rule2:#141719;
  --bone:#e8eaec; --dim:#79828a; --faint:#4a5257;
  --amber:#d8a24a; --cyan:#5fb0b7; --red:#e2543c; --green:#71a184;
  --safe:1.7vw; --col:1.5vw;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;max-width:100%}
body{
  background:
    linear-gradient(180deg,#0d0f11 0%,rgba(13,15,17,0) 22%),
    radial-gradient(140% 100% at 50% 120%, #0f1215 0%, rgba(15,18,21,0) 55%),
    var(--ground);
  color:var(--bone);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* a faint vertical striping. it reads as a printed page rather than a flat fill. */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.5;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='110' height='110'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='110' height='110' filter='url(%23n)'/></svg>")}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

#board{position:relative;z-index:2;height:100%;padding:var(--safe);
  display:flex;flex-direction:column;gap:.55vw}
.hq-sample #board{padding-bottom:calc(var(--safe) + 2.5em)}

/* ── SCN-01 · masthead ───────────────────────────────────────────────────── */
.mast{display:grid;grid-template-columns:auto auto 1fr auto;gap:1.3vw;align-items:baseline;
  border-bottom:2px solid var(--rule);padding-bottom:.35vw}
.mastclock{font-size:clamp(24px,min(3.4vw,6.2vh),58px);font-weight:800;letter-spacing:-.055em;
  line-height:.9;font-variant-numeric:tabular-nums}
.mastclock .mer{font-size:.28em;font-weight:500;color:var(--dim);letter-spacing:.1em;margin-left:.1em}
.mastdate{font-size:clamp(9px,min(1vw,1.85vh),15px);color:var(--dim);font-weight:600;
  letter-spacing:.02em}
.mastdate b{color:var(--bone)}
.mastwire{font-size:clamp(8px,min(.86vw,1.6vh),12px);color:var(--faint);font-weight:600;
  display:flex;align-items:center;justify-content:flex-end;gap:.5em;text-align:right}
.masttitle{font-size:clamp(8px,min(.84vw,1.55vh),12px);letter-spacing:.3em;font-weight:700;
  color:var(--amber);text-transform:uppercase}

/* ── SCN-02 · the instrument strip. every source, as a gauge. ────────────── */
.gauges{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.8vw;
  border-bottom:1px solid var(--rule);padding:.3vw 0 .4vw}
.g{min-width:0}
.g .gn{font-size:clamp(7px,min(.76vw,1.42vh),10.5px);letter-spacing:.13em;font-weight:700;
  color:var(--faint);text-transform:uppercase;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.g .gv{font-size:clamp(8.5px,min(.94vw,1.75vh),13px);font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1.2}
.g .gb{height:2px;background:var(--rule2);margin-top:.16vw;overflow:hidden}
.g .gb i{display:block;height:100%;transition:width 1.2s linear}
.g.fresh .gv{color:var(--green)} .g.fresh .gb i{background:var(--green)}
.g.stale .gv{color:#8b8a80} .g.stale .gb i{background:#6d6c63}
.g.unknown .gv{color:var(--red)} .g.unknown .gb i{background:var(--red);
  background:repeating-linear-gradient(90deg,#5a2a20 0 4px,transparent 4px 8px);width:100%!important}

/* ── the six columns ─────────────────────────────────────────────────────── */
.cols{flex:1 1 62%;min-height:0;display:grid;
  grid-template-columns:1.55fr 1fr 1.05fr 1.15fr 1fr;
  gap:0}
.c{min-height:0;display:flex;flex-direction:column;gap:.25vw;overflow:hidden;
  padding:.5vw var(--col) 0;border-left:1px solid var(--rule)}
.c:first-child{border-left:none;padding-left:0}
.c:last-child{padding-right:0}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:.6vw;flex-shrink:0;
  border-bottom:1px solid var(--rule);padding-bottom:.22vw;margin-bottom:.28vw}
.ch .cn{font-size:clamp(7.5px,min(.8vw,1.5vh),11px);letter-spacing:.22em;font-weight:700;
  color:var(--amber);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .cc{font-size:clamp(7px,min(.76vw,1.42vh),10px);color:var(--faint);font-weight:700;
  font-variant-numeric:tabular-nums;flex-shrink:0}
.more{font-size:clamp(7.5px,min(.8vw,1.5vh),11px);color:var(--faint);font-weight:700;
  letter-spacing:.05em;padding-top:.2vw;flex-shrink:0}

/* col 1 · the lead. one statement, then a numbered queue. */
.leadkick{font-size:clamp(8.5px,min(.9vw,1.7vh),13px);color:var(--red);font-weight:800;
  letter-spacing:.14em;text-transform:uppercase}
.leadsay{font-size:clamp(16px,min(2.1vw,3.9vh),38px);font-weight:800;letter-spacing:-.042em;
  line-height:1.02;margin:.15vw 0 .2vw}
.leadwhy{font-size:clamp(9px,min(.98vw,1.85vh),15px);color:var(--dim);font-weight:500;
  line-height:1.35;border-left:2px solid var(--red);padding-left:.6vw}
.q{display:flex;flex-direction:column;min-height:0;overflow:hidden;margin-top:.4vw}
.q .qi{display:grid;grid-template-columns:1.6em 1fr auto;gap:.4vw;align-items:baseline;
  padding:.24vw 0;border-bottom:1px solid var(--rule2);
  font-size:clamp(9px,min(.98vw,1.85vh),15px);font-weight:500}
.q .qi b{color:var(--amber);font-weight:800;font-family:"JetBrains Mono",monospace;font-size:.85em}
.q .qi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .qi em{font-style:normal;color:var(--faint);font-weight:700;font-size:.82em;
  letter-spacing:.04em;white-space:nowrap}

/* pinned to the foot of a column: what the screen cannot tell you, and why */
.foot{margin-top:auto;flex-shrink:0;border-top:1px solid var(--rule);padding-top:.35vw}
.foot .fl{font-size:clamp(7px,min(.74vw,1.4vh),10px);letter-spacing:.2em;font-weight:700;
  color:var(--faint);text-transform:uppercase;margin-bottom:.15vw}
.foot .fi{font-size:clamp(8px,min(.86vw,1.6vh),12.5px);color:var(--dim);font-weight:600;
  line-height:1.3;padding:.1vw 0;display:flex;gap:.5em}
.foot .fi b{color:var(--red);font-weight:800;flex-shrink:0}
.foot .fi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* col 2 · the ladder. money out, ordered by when it lands. */
.lad{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lad .li{display:grid;grid-template-columns:auto 1fr auto;gap:.45vw;align-items:baseline;
  padding:.26vw 0;border-bottom:1px solid var(--rule2)}
.lad .lw{font-size:clamp(7.5px,min(.8vw,1.5vh),11px);font-weight:800;color:var(--faint);
  font-family:"JetBrains Mono",monospace;min-width:5.4ch;text-align:right}
.lad .ln{font-size:clamp(9px,min(.96vw,1.8vh),14px);font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.lad .la{font-size:clamp(9px,min(.98vw,1.85vh),15px);font-weight:800;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.lad .li.late .lw,.lad .li.late .la,.lad .li.late .ln{color:var(--red)}
.lad .li.soon .la{color:var(--amber)}
/* this column is about 90px wide. the word "invented" beside every figure eats the
   names, so here the tag becomes a dotted rule under the number and the column
   says so once at its foot. the tag itself stays spelled out everywhere it fits. */
.lad .hq-inv{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.lad .la .hq-v{border-bottom:1px dotted currentColor}

/* col 3 · the rail. today, drawn as a vertical clock. */
.rail{position:relative;flex:1;min-height:0;overflow:hidden;padding-left:1.3vw;margin-top:.2vw}
.rail::before{content:"";position:absolute;left:.28vw;top:.2vw;bottom:.2vw;width:1px;
  background:linear-gradient(180deg,var(--cyan),rgba(95,176,183,.06))}
.rn{position:relative;padding:.3vw 0;border-bottom:1px solid var(--rule2)}
.rn::before{content:"";position:absolute;left:-1.13vw;top:.62vw;width:.42vw;height:.42vw;
  min-width:6px;min-height:6px;border-radius:50%;background:var(--ground);
  border:1.5px solid var(--cyan)}
.rn.now::before{background:var(--cyan);box-shadow:0 0 0 .22vw rgba(95,176,183,.2)}
.rn .rt{font-size:clamp(9px,min(.98vw,1.85vh),15px);font-weight:700;letter-spacing:-.015em;
  line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn .rw{font-size:clamp(7.5px,min(.8vw,1.5vh),11px);color:var(--dim);font-weight:700;
  font-family:"JetBrains Mono",monospace}
.rn.past{opacity:.36}

/* col 4 · the ledger. to do, weighted by when. */
.led{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.led .ti{display:grid;grid-template-columns:auto 1fr;gap:.45vw;align-items:baseline;
  padding:.26vw 0;border-bottom:1px solid var(--rule2)}
.led .tb{width:.42vw;height:.42vw;min-width:6px;min-height:6px;border-radius:1px;
  align-self:center;background:var(--faint)}
.led .ti.today .tb{background:var(--amber)}
.led .tt{font-size:clamp(9px,min(.96vw,1.8vh),14px);font-weight:600;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.led .ti.today .tt{font-weight:700}

/* col 5 · the strip. projects and the open questions. */
.pr{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pr .pi{display:flex;justify-content:space-between;gap:.4vw;align-items:baseline;
  padding:.24vw 0;border-bottom:1px solid var(--rule2);
  font-size:clamp(8.5px,min(.92vw,1.72vh),13.5px)}
.pr .pn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .ps{color:var(--dim);font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:58%;text-align:right}
.pr .pi.warn .ps{color:var(--red)} .pr .pi.live .ps{color:var(--green)}
.open{margin-top:.45vw;flex-shrink:0;border-top:1px solid var(--rule);padding-top:.35vw}
.open .oi{font-size:clamp(8px,min(.88vw,1.65vh),13px);color:var(--dim);font-weight:500;
  padding:.12vw 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open .oi::before{content:"? ";color:var(--amber);font-weight:800}

/* ── SCN-08 · the seven day band. a different rhythm again: horizontal. ──── */
.band{flex:0 0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:0;
  border-top:1px solid var(--rule);padding-top:.35vw;min-height:0}
.bd{border-left:1px solid var(--rule2);padding:.2vw .7vw 0;min-width:0;overflow:hidden}
.bd:first-child{border-left:none;padding-left:0}
.bd.today{background:linear-gradient(180deg,rgba(216,162,74,.10),rgba(216,162,74,0))}
.bd .bh{display:flex;align-items:baseline;gap:.4em}
.bd .bdow{font-size:clamp(7px,min(.76vw,1.42vh),10.5px);letter-spacing:.18em;font-weight:700;
  color:var(--faint);text-transform:uppercase}
.bd.today .bdow{color:var(--amber)}
.bd .bnum{font-size:clamp(11px,min(1.25vw,2.35vh),20px);font-weight:800;letter-spacing:-.03em}
.bd .bmeta{font-size:clamp(7px,min(.76vw,1.42vh),10.5px);color:var(--faint);font-weight:700;
  font-family:"JetBrains Mono",monospace;margin:.06vw 0 .14vw}
.bd .bmeta u{text-decoration:none;color:var(--amber)}
.bd .bi{font-size:clamp(8px,min(.86vw,1.6vh),12.5px);color:var(--dim);font-weight:600;
  line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.05vw 0}
.bd .bi.money{color:#c99a56}
.bd .bi.none{color:var(--faint);font-style:italic}

/* ── SCN-09 · the footer strip ───────────────────────────────────────────── */
.strip{flex-shrink:0;border-top:2px solid var(--rule);padding-top:.35vw;
  display:flex;gap:1.5vw;align-items:baseline;overflow:hidden;
  font-size:clamp(8.5px,min(.92vw,1.72vh),13.5px);font-weight:600;color:var(--dim);
  white-space:nowrap}
.strip .sl{font-size:clamp(7.5px,min(.8vw,1.5vh),11px);letter-spacing:.22em;font-weight:700;
  color:var(--amber);text-transform:uppercase;flex-shrink:0}
.strip b{color:var(--bone);font-weight:800}
.strip .red{color:var(--red)}

@media (max-width:1150px){
  :root{--safe:16px;--col:0}
  html,body{overflow:auto;height:auto}
  #board{height:auto;min-height:100%;gap:14px}
  .mast{grid-template-columns:1fr;gap:4px}
  .mastwire{justify-content:flex-start;text-align:left}
  .gauges{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);gap:10px}
  .cols{grid-template-columns:1fr;gap:0}
  .c{border-left:none;border-top:1px solid var(--rule);padding:14px 0 0;overflow:visible}
  .c:first-child{border-top:none;padding-top:0}
  .leadsay{font-size:26px} .leadwhy{font-size:14px}
  .q .qi,.lad .ln,.rn .rt,.led .tt,.pr .pi{font-size:14.5px}
  .lad .la{font-size:14.5px}
  .rail{padding-left:20px} .rail::before{left:4px}
  .rn::before{left:-17px;top:10px;width:8px;height:8px}
  .strip{flex-direction:column;gap:5px;white-space:normal}
  .band{grid-template-columns:repeat(2,1fr);gap:10px}
  .bd{border-left:none;padding:8px 0;border-top:1px solid var(--rule2)}
  .bd .bi{font-size:13px;white-space:normal}
  .hq-sample #board{padding-bottom:130px}
}
@media (prefers-reduced-motion:reduce){ .g .gb i{transition:none} }
</style>
</head>
<body>

<main id="board">

  <!-- SCN-01 · MASTHEAD -->
  <header class="mast">
    <div class="mastclock" id="clock">--:--</div>
    <div class="masttitle mono">samuel hq · console</div>
    <div class="mastdate" id="dateline">&nbsp;</div>
    <div class="mastwire mono" id="refresh">&nbsp;</div>
  </header>

  <!-- SCN-02 · INSTRUMENT STRIP -->
  <section class="gauges" id="gauges"></section>

  <div class="cols">

    <!-- SCN-03 · THE LEAD -->
    <section class="c">
      <div class="ch"><span class="cn mono">do this next</span><span class="cc mono" id="qCount"></span></div>
      <div class="leadkick mono" id="leadKick"></div>
      <div class="leadsay" id="leadSay">&nbsp;</div>
      <div class="leadwhy" id="leadWhy"></div>
      <div class="q" id="queue"></div>
      <div class="foot" id="missing"></div>
    </section>

    <!-- SCN-04 · MONEY OUT -->
    <section class="c">
      <div class="ch"><span class="cn mono">money out</span><span class="cc mono" id="ladCount"></span></div>
      <div class="lad" id="ladder"></div>
      <div class="more mono" id="ladMore"></div>
      <div class="more mono" id="ladLegend" style="color:#5f6a70"></div>
    </section>

    <!-- SCN-05 · TODAY -->
    <section class="c">
      <div class="ch"><span class="cn mono">today</span><span class="cc mono" id="railCount"></span></div>
      <div class="rail" id="rail"></div>
      <div class="foot" id="tomorrow"></div>
    </section>

    <!-- SCN-06 · TO DO -->
    <section class="c">
      <div class="ch"><span class="cn mono">to do</span><span class="cc mono" id="ledCount"></span></div>
      <div class="led" id="ledger"></div>
      <div class="more mono" id="ledMore"></div>
    </section>

    <!-- SCN-07 · PROJECTS + OPEN QUESTIONS -->
    <section class="c">
      <div class="ch"><span class="cn mono">projects</span><span class="cc mono" id="prCount"></span></div>
      <div class="pr" id="projects"></div>
      <div class="open" id="open"></div>
    </section>
  </div>

  <!-- SCN-08 · SEVEN DAYS -->
  <section class="band" id="band"></section>

  <!-- SCN-09 · THE STRIP -->
  <div class="strip">
    <span class="sl">on the clock</span>
    <span id="strip"></span>
  </div>
</main>

<!-- data.local.js is his real numbers. it is gitignored and is missing on a fresh
     clone, where this tag 404s harmlessly and the committed sample below takes over. -->
<script src="data.local.js"></script>
<script src="data.js"></script>
<script src="hq-core.js"></script>
<script>
"use strict";
function two(n){ return String(n).padStart(2,"0"); }

HQ.everySecond(function(){
  var n = new Date(), h = n.getHours();
  document.getElementById("clock").innerHTML =
    (h % 12 || 12) + ":" + two(n.getMinutes()) +
    '<span class="mer">' + (h >= 12 ? "pm" : "am") + '</span>';
});

/* every column caps itself and admits the cap. no column ever runs off a screen. */
function cap(list, n, render, moreEl, noun){
  var shown = list.slice(0, n);
  var html = shown.map(render).join("");
  if (moreEl) moreEl.textContent = list.length > n
    ? "and " + (list.length - n) + " more " + (noun || "") : "";
  return html;
}

function render(){
  var D = HQ.data();
  var now = new Date();

  document.getElementById("dateline").innerHTML =
    "<b>" + now.toLocaleDateString(undefined,{weekday:"long"}).toLowerCase() + "</b> " +
    now.toLocaleDateString(undefined,{month:"long",day:"numeric"}).toLowerCase() +
    " · Arlington " + HQ.field("weather", D.weather && D.weather.value,
      {needs:"one free forecast call, once an hour. not wired yet"});

  /* ── SCN-02 · gauges ─────────────────────────────────────────────────── */
  var srcs = Object.keys(D.sources || {}).map(HQ.fresh);
  document.getElementById("gauges").innerHTML = srcs.map(function(s){
    return '<div class="g ' + s.state + '">' +
      '<div class="gn mono">' + HQ.esc(s.label) + '</div>' +
      '<div class="gv mono">' + (s.state === "unknown" ? "no source" : s.age) + '</div>' +
      '<div class="gb"><i style="width:' + (s.left*100).toFixed(1) + '%"></i></div></div>';
  }).join("");

  /* ── SCN-03 · the lead + the queue ───────────────────────────────────── */
  var deadlines = (D.deadlines||[]).slice().sort(function(a,b){
    return HQ.daysFromToday(a.on) - HQ.daysFromToday(b.on); });
  var lead = deadlines[0];
  if (lead){
    document.getElementById("leadKick").textContent =
      HQ.dueTone(lead.on) === "late" ? "overdue · " + HQ.dueText(lead.on) : HQ.dueText(lead.on);
    document.getElementById("leadSay").textContent = lead.name;
    document.getElementById("leadWhy").textContent = lead.why || "";
  }
  var todos = (D.todos||[]);
  var queue = todos.filter(function(t){ return t.when === "today"; })
    .concat(todos.filter(function(t){ return t.when === "this week"; }));
  document.getElementById("qCount").textContent = queue.length;
  document.getElementById("queue").innerHTML = cap(queue, 6, function(t,i){
    return '<div class="qi"><b>' + two(i+1) + '</b><span>' + HQ.esc(t.text) + '</span>' +
      '<em>' + HQ.esc(t.when) + '</em></div>';
  }) + (queue.length > 6 ? '<div class="more mono">and ' + (queue.length-6) + ' more</div>' : "");

  /* ── SCN-04 · money out ──────────────────────────────────────────────── */
  var out = (D.bills||[]).filter(function(b){ return !b.paid; })
    .map(function(b){ return {n:b.name, w:b.due, a:b.amount, src:b.source, sample:b.sample}; })
    .concat((D.subscriptions||[]).map(function(s){
      return {n:s.name, w:s.renews, a:s.amount, src:s.source, sample:s.sample, sub:true}; }))
    .sort(function(a,b){ return HQ.daysFromToday(a.w) - HQ.daysFromToday(b.w); });
  document.getElementById("ladCount").textContent = out.length;
  document.getElementById("ladder").innerHTML = cap(out, 9, function(x){
    var d = HQ.daysFromToday(x.w);
    var cls = d < 0 ? "late" : d <= 3 ? "soon" : "";
    var w = d < 0 ? (-d) + "d late" : d === 0 ? "today" : "+" + d + "d";
    return '<div class="li ' + cls + '"><span class="lw">' + w + '</span>' +
      '<span class="ln">' + HQ.esc(x.n) + (x.sub ? " ·" : "") + '</span>' +
      '<span class="la">' + HQ.amt(x.a, x.sample, x.src, null) + '</span></div>';
  }, document.getElementById("ladMore"), "this month");
  document.getElementById("ladLegend").textContent =
    "dotted = invented · ? = no amount stored";

  /* ── SCN-05 · today ──────────────────────────────────────────────────── */
  var today = (D.events||[]).map(function(e){
      return {t:e.title, s:new Date(e.start), e:new Date(e.end)}; })
    .filter(function(e){ return e.s.toDateString() === now.toDateString(); })
    .sort(function(a,b){ return a.s - b.s; });
  document.getElementById("railCount").textContent = today.length;
  var railEl = document.getElementById("rail");
  if (!today.length){
    railEl.innerHTML = '<div class="rn"><div class="rt" style="color:var(--dim)">' +
      'nothing on the books today</div><div class="rw">no calendar is connected</div></div>';
  } else {
    railEl.innerHTML = cap(today, 7, function(e){
      var running = e.s <= now && e.e > now;
      var past = e.e <= now;
      var mm = Math.round((e.s - now)/60000);
      var when = running ? "running now"
        : past ? "done"
        : mm < 60 ? "in " + mm + "m" : "in " + Math.floor(mm/60) + "h " + (mm%60) + "m";
      return '<div class="rn' + (running ? " now" : past ? " past" : "") + '">' +
        '<div class="rt">' + HQ.esc(e.t) + '</div>' +
        '<div class="rw">' + HQ.clockOf(e.s) + " · " + when + '</div></div>';
    }) + (today.length > 7 ? '<div class="more mono">and ' + (today.length-7) + ' more today</div>' : "");
  }

  /* what this screen cannot tell you. pinned to the foot of the lead column. */
  var missing = srcs.filter(function(x){ return x.state === "unknown"; });
  document.getElementById("missing").innerHTML = missing.length
    ? '<div class="fl mono">not connected · ' + missing.length + '</div>' +
      missing.slice(0,3).map(function(x){
        return '<div class="fi"><b>' + HQ.esc(x.label) + '</b><span>' + HQ.esc(x.needs) +
          '</span></div>'; }).join("") +
      (missing.length > 3 ? '<div class="fi" style="color:var(--faint)"><span>and ' +
        (missing.length-3) + ' more</span></div>' : "")
    : '<div class="fl mono">every source is connected</div>';

  /* tomorrow, at the foot of the today column */
  var tm = new Date(); tm.setDate(tm.getDate()+1);
  var tmEvs = (D.events||[]).map(function(e){ return {t:e.title, s:new Date(e.start)}; })
    .filter(function(e){ return e.s.toDateString() === tm.toDateString(); })
    .sort(function(a,b){ return a.s - b.s; });
  document.getElementById("tomorrow").innerHTML =
    '<div class="fl mono">tomorrow · ' + tmEvs.length + '</div>' +
    (tmEvs.length
      ? tmEvs.slice(0,3).map(function(e){
          return '<div class="fi"><b style="color:var(--cyan)">' + HQ.clockOf(e.s) +
            '</b><span>' + HQ.esc(e.t) + '</span></div>'; }).join("") +
        (tmEvs.length > 3 ? '<div class="fi" style="color:var(--faint)"><span>and ' +
          (tmEvs.length-3) + ' more</span></div>' : "")
      : '<div class="fi" style="color:var(--faint)"><span>clear, as far as HQ knows</span></div>');

  /* ── SCN-06 · to do, everything, weighted ────────────────────────────── */
  document.getElementById("ledCount").textContent = todos.length;
  document.getElementById("ledger").innerHTML = cap(todos, 9, function(t){
    return '<div class="ti ' + (t.when === "today" ? "today" : "") + '">' +
      '<span class="tb"></span><span class="tt">' + HQ.esc(t.text) + '</span></div>';
  }, document.getElementById("ledMore"), "in HQ");

  /* ── SCN-07 · projects + open questions ──────────────────────────────── */
  var projects = D.projects || [];
  document.getElementById("prCount").textContent = projects.length;
  document.getElementById("projects").innerHTML = cap(projects, 6, function(p){
    return '<div class="pi ' + HQ.esc(p.tone||"") + '"><span class="pn">' + HQ.esc(p.name) +
      '</span><span class="ps">' + HQ.esc(p.status) + '</span></div>';
  });
  document.getElementById("open").innerHTML =
    '<div class="cn mono" style="font-size:clamp(7px,.74vw,10px);letter-spacing:.2em;' +
    'color:var(--faint);text-transform:uppercase;margin-bottom:.2vw">still unanswered</div>' +
    (function(){
      var all = D.whiteboard || [], show = all.slice(0,4);
      return show.map(function(w){ return '<div class="oi">' + HQ.esc(w) + '</div>'; }).join("") +
        (all.length > show.length
          ? '<div class="more mono">and ' + (all.length - show.length) + ' more in HQ</div>' : "");
    })();

  /* ── SCN-08 · seven days. events and money, side by side, per day. ───── */
  var DOWN = ["sun","mon","tue","wed","thu","fri","sat"];
  var evAll = (D.events||[]).map(function(e){ return {t:e.title, s:new Date(e.start)}; });
  var outAll = out;
  var bandHtml = "";
  for (var i = 0; i < 7; i++){
    var d = new Date(); d.setDate(d.getDate() + i);
    var key = d.toDateString();
    var evs = evAll.filter(function(e){ return e.s.toDateString() === key; })
                   .sort(function(a,b){ return a.s - b.s; });
    var mon = outAll.filter(function(x){
      var dd = HQ.daysFromToday(x.w); return dd === i; });
    var items = evs.slice(0,2).map(function(e){
        return '<div class="bi">' + HQ.clockOf(e.s) + " " + HQ.esc(e.t) + '</div>'; })
      .concat(mon.slice(0, evs.length > 1 ? 1 : 2).map(function(x){
        return '<div class="bi money">' + (HQ.money(x.a) || "?") + " " + HQ.esc(x.n) + '</div>'; }));
    var hidden = (evs.length + mon.length) - items.length;
    if (!items.length) items = ['<div class="bi none">clear</div>'];
    else if (hidden > 0) items.push('<div class="bi" style="color:var(--faint)">and ' + hidden + ' more</div>');
    bandHtml += '<div class="bd' + (i === 0 ? " today" : "") + '">' +
      '<div class="bh"><span class="bdow">' + DOWN[d.getDay()] + '</span>' +
      '<span class="bnum">' + d.getDate() + '</span></div>' +
      '<div class="bmeta">' + evs.length + ' on the books' +
      (mon.length ? ' · <u>' + mon.length + ' due</u>' : '') + '</div>' +
      items.join("") + '</div>';
  }
  document.getElementById("band").innerHTML = bandHtml;

  /* ── SCN-09 · the strip. the lead is already said at size, so drop it. ─ */
  document.getElementById("strip").innerHTML = deadlines.filter(function(d){
    return !lead || d.name !== lead.name; }).slice(0,5).map(function(d){
    var tone = HQ.dueTone(d.on);
    return '<span' + (tone === "late" ? ' class="red"' : '') + '>' + HQ.esc(d.name) +
      ' <b>' + HQ.dueText(d.on) + '</b></span>';
  }).join(" &nbsp;·&nbsp; ");
}

HQ.boot(render);
HQ.refreshLine(document.getElementById("refresh"));
setTimeout(function(){
  var el = document.getElementById("leadSay");
  if (el && el.textContent.trim() === "")
    el.textContent = "data did not load. run python3 make-data.py in this folder.";
}, 2500);
</script>
</body>
</html>
