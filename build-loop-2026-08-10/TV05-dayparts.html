<!doctype html>
<html lang="en" data-part="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0908">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>TV05 · dayparts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   TV05 · dayparts
   The screen is on for 24 hours. It should not show the same thing for 24 hours.
   Four states, chosen by the clock, not by a tap:

     NIGHT    22:00 to sunrise   almost nothing. a dim amber clock and the alarm.
     DAWN     sunrise to +90m    the room lights up. first thing, and one number.
     DAY      to 17:00           the working screen. today, money, the queue.
     EVENING  17:00 to 22:00     wind down. tomorrow's first thing, what is left.

   The sunrise ramp is the same idea as the shipped alarm: the TV is already the
   biggest lamp in the room, so it is used as one. The audio session handling from
   v7 is reproduced verbatim in the script and credited, because it was hard won
   and must not be reinvented. This page does NOT try to be the alarm of record:
   the live index.html owns that.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --bone:#f3ede2; --safe:2.2vw; --gap:.9vw;
  --ground:#0b0908; --panel:#151110; --line:#241d19; --dim:#8b8073; --faint:#57503f;
  --accent:#c9a96a; --alert:#d0402e; --ok:#7e9b7a;
}
/* each daypart is a real change of light, not a swapped accent colour */
[data-part="night"]{ --ground:#070504; --panel:#100b08; --line:#1c1410;
  --bone:#e8a86f; --dim:#8a5f42; --faint:#5a3a26; --accent:#e8a86f; }
[data-part="dawn"]{ --ground:#170d08; --panel:#22140c; --line:#3a2113;
  --bone:#ffe6cf; --dim:#c08e63; --faint:#8a5f3c; --accent:#ffb469; }
[data-part="day"]{ --ground:#0d0b09; --panel:#17120e; --line:#2a2219;
  --bone:#f2ece0; --dim:#8d8271; --faint:#5c5347; --accent:#c9a96a; }
[data-part="evening"]{ --ground:#0a0a0d; --panel:#131218; --line:#221f2b;
  --bone:#e6e3ee; --dim:#7f7b90; --faint:#514e60; --accent:#9d8fc4; }

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;max-width:100%}
body{background:var(--ground);color:var(--bone);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background 1.6s linear,color 1.6s linear}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

/* the lamp. the same radial ramp the shipped alarm uses. */
#sunrise{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:2;
  background:radial-gradient(120% 85% at 50% 118%, #ffd9a0 0%, #ff9d4d 26%, #d9541f 48%,
    rgba(60,20,6,0) 78%);
  transition:opacity 1.4s linear}
/* the evening counterpart: a cool fall, so the room reads as winding down */
#dusk{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:2;
  background:radial-gradient(130% 95% at 50% 120%, #2a2440 0%, #1a1730 40%, rgba(10,10,20,0) 75%);
  transition:opacity 2.2s linear}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='130' height='130'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='130' height='130' filter='url(%23n)'/></svg>")}

#board{position:relative;z-index:4;height:100%;padding:var(--safe);
  display:flex;flex-direction:column;gap:var(--gap)}
.hq-sample #board{padding-bottom:calc(var(--safe) + 2.6em)}

/* ── SCN-01 · the head, which shrinks and grows with the daypart ─────────── */
.head{display:grid;grid-template-columns:1fr auto;gap:1.4vw;align-items:end;
  border-bottom:1px solid var(--line);padding-bottom:.6vw;flex-shrink:0}
.clock{font-weight:800;letter-spacing:-.055em;line-height:.84;font-variant-numeric:tabular-nums;
  font-size:clamp(40px,min(7vw,12vh),120px);transition:font-size 1.2s ease}
[data-part="night"] .clock{font-size:clamp(70px,min(15vw,26vh),260px)}
[data-part="dawn"] .clock{font-size:clamp(56px,min(11vw,19vh),190px)}
.clock .mer{font-size:.2em;font-weight:500;letter-spacing:.13em;color:var(--dim);
  margin-left:.12em;vertical-align:.95em}
.sub{font-size:clamp(10px,min(1.15vw,2.1vh),18px);color:var(--dim);font-weight:500;margin-top:.3vw}
.sub b{color:var(--bone);font-weight:700}
.partchip{display:inline-flex;align-items:center;gap:.5em;padding:.22em .8em;border-radius:999px;
  border:1px solid var(--accent);color:var(--accent);
  font-size:clamp(8px,min(.84vw,1.55vh),12px);letter-spacing:.22em;font-weight:700;
  text-transform:uppercase;white-space:nowrap}
.headright{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:.35vw}
.refresh{font-size:clamp(8.5px,min(.9vw,1.7vh),13px);color:var(--faint);display:flex;
  align-items:center}

/* ── the stage. what fills it depends entirely on the hour. ──────────────── */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--gap)}

/* NIGHT: one line, and nothing else. */
.night{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:2.2vh;text-align:center}
.night .big{font-size:clamp(15px,min(1.9vw,3.4vh),30px);font-weight:700;letter-spacing:-.02em}
.night .small{font-size:clamp(10px,min(1.15vw,2.1vh),17px);color:var(--dim);font-weight:500;
  max-width:40ch;line-height:1.5}
.night .until{font-size:clamp(20px,min(3vw,5.4vh),52px);font-weight:800;letter-spacing:-.04em;
  color:var(--accent)}

/* DAWN: one thing to do, one number, one line of weather. */
.dawn{flex:1;display:none;flex-direction:column;justify-content:center;gap:1.4vh;max-width:32ch}
.dawn .kick{font-size:clamp(9px,min(.95vw,1.8vh),14px);letter-spacing:.24em;font-weight:700;
  color:var(--accent);text-transform:uppercase}
.dawn .say{font-size:clamp(22px,min(3.4vw,6vh),64px);font-weight:800;letter-spacing:-.045em;
  line-height:1}
.dawn .why{font-size:clamp(11px,min(1.25vw,2.3vh),19px);color:var(--dim);font-weight:500;
  line-height:1.4}

/* DAY and EVENING: a three panel working screen with different content each */
/* panels hug their content and sit at the top. a calm screen is allowed to have
   ground under it; stretching three panels to fill 1080px just makes three holes. */
.work{flex:1;min-height:0;display:none;grid-template-columns:1.5fr 1fr 1fr;gap:var(--gap);
  align-items:start;align-content:start}
.work .p{max-height:100%}
.p{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.35vw;
  background:linear-gradient(178deg,var(--panel),rgba(0,0,0,.25));
  border:1px solid var(--line);border-radius:3px;padding:.8vw 1vw;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 16px 34px -26px #000}
.p .lab{font-size:clamp(8px,min(.82vw,1.55vh),12px);letter-spacing:.24em;font-weight:700;
  color:var(--faint);text-transform:uppercase;flex-shrink:0;
  display:flex;justify-content:space-between;gap:.6em}
.lead{font-size:clamp(17px,min(2.3vw,4.2vh),40px);font-weight:800;letter-spacing:-.04em;
  line-height:1.03;margin-top:.2vw}
.leadwhy{font-size:clamp(9.5px,min(1.02vw,1.95vh),15px);color:var(--dim);font-weight:500;
  line-height:1.35;border-left:2px solid var(--accent);padding-left:.6vw;margin-top:.35vw}
.rows{display:flex;flex-direction:column;min-height:0;overflow:hidden;margin-top:.3vw}
.row{display:flex;justify-content:space-between;gap:.7vw;align-items:baseline;
  padding:.24vw 0;border-bottom:1px solid rgba(255,255,255,.05);
  font-size:clamp(9.5px,min(1.02vw,1.95vh),15px);font-weight:500}
.row:last-child{border-bottom:none}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{flex-shrink:0;color:var(--dim);font-weight:700;font-family:"JetBrains Mono",monospace;
  font-size:.85em}
.row .st.late{color:var(--alert)} .row .st.now{color:var(--accent)}
.more{font-size:clamp(8.5px,min(.9vw,1.7vh),13px);color:var(--faint);font-weight:700;padding-top:.2vw}

/* ── SCN-05 · the review bar. not for the TV. ────────────────────────────── */
#bar{position:fixed;bottom:0;left:0;right:0;z-index:600;display:flex;gap:.5vw;
  justify-content:center;align-items:center;padding:.5vw;opacity:.22;transition:opacity .25s;
  flex-wrap:wrap}
.hq-sample #bar{bottom:2.6em}
#bar:hover,#bar:focus-within{opacity:1}
#bar button{background:var(--panel);color:var(--dim);border:1px solid var(--line);
  padding:.4vw .9vw;font-family:inherit;font-size:clamp(9px,min(.95vw,1.8vh),14px);
  font-weight:600;cursor:pointer;border-radius:3px}
#bar button:hover,#bar button:focus-visible{color:var(--bone);border-color:var(--accent);outline:none}
#bar button.on{background:var(--accent);border-color:var(--accent);color:#241b06}
#bar .note{font-size:clamp(8px,min(.85vw,1.6vh),12px);color:var(--faint);font-weight:600;
  margin-left:.6vw}

@media (max-width:1000px){
  :root{--safe:16px;--gap:12px}
  html,body{overflow:auto;height:auto}
  #board{height:auto;min-height:100%}
  .head{grid-template-columns:1fr;gap:8px}
  .headright{align-items:flex-start;text-align:left}
  .work{grid-template-columns:1fr}
  .clock{font-size:clamp(44px,15vw,90px)!important}
  .dawn .say{font-size:30px} .lead{font-size:26px}
  .row,.leadwhy{font-size:14.5px}
  #bar{position:static;opacity:1;padding:14px 0;justify-content:flex-start}
  .hq-sample #board{padding-bottom:130px}
}
@media (prefers-reduced-motion:reduce){ #sunrise,#dusk,.clock,body{transition:none} }
</style>
</head>
<body>

<div id="sunrise"></div>
<div id="dusk"></div>

<main id="board">

  <!-- SCN-01 · HEAD -->
  <header class="head">
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="sub" id="dateline">&nbsp;</div>
    </div>
    <div class="headright">
      <div class="partchip mono" id="partChip">day</div>
      <div class="sub" id="alarmLine" style="margin:0">&nbsp;</div>
      <div class="refresh mono" id="refresh">&nbsp;</div>
    </div>
  </header>

  <div class="stage">

    <!-- SCN-02 · NIGHT -->
    <section class="night" id="sNight">
      <div class="mono" style="letter-spacing:.28em;font-size:clamp(9px,1vw,14px);color:var(--faint)">
        WIND DOWN
      </div>
      <div class="until mono" id="nUntil">&nbsp;</div>
      <div class="big" id="nBig">&nbsp;</div>
      <div class="small" id="nSmall">&nbsp;</div>
    </section>

    <!-- SCN-03 · DAWN -->
    <section class="dawn" id="sDawn">
      <div class="kick mono">first thing</div>
      <div class="say" id="dSay">&nbsp;</div>
      <div class="why" id="dWhy"></div>
      <div class="why mono" id="dNums" style="color:var(--accent)"></div>
    </section>

    <!-- SCN-04 · DAY and EVENING -->
    <section class="work" id="sWork">
      <div class="p">
        <div class="lab"><span id="wLead1">do this next</span><span id="wLeadAge"></span></div>
        <div class="lead" id="wLead">&nbsp;</div>
        <div class="leadwhy" id="wWhy"></div>
        <div class="rows" id="wQueue"></div>
      </div>
      <div class="p">
        <div class="lab"><span id="wMidLab">today</span><span id="wMidCount"></span></div>
        <div class="rows" id="wMid"></div>
      </div>
      <div class="p">
        <div class="lab"><span id="wRightLab">money out</span><span id="wRightCount"></span></div>
        <div class="rows" id="wRight"></div>
      </div>
    </section>
  </div>
</main>

<!-- SCN-05 · the review bar. explicitly not part of the TV screen. -->
<div id="bar">
  <button data-set="auto" class="on">auto, by the clock</button>
  <button data-set="night">night</button>
  <button data-set="dawn">dawn</button>
  <button data-set="day">day</button>
  <button data-set="evening">evening</button>
  <button id="ramp">run the sunrise</button>
  <span class="note">for review only. the TV follows the real clock and is never tapped.</span>
</div>

<script src="data.js"></script>
<script src="hq-core.js"></script>
<script>
"use strict";
function two(n){ return String(n).padStart(2,"0"); }

var forced = null;                       // review override, null means follow the clock
/* ?part=night|dawn|day|evening forces one, so a screenshot or a review can see
   a daypart without waiting twelve hours for it. */
try{
  var qp = new URLSearchParams(location.search).get("part");
  if (["night","dawn","day","evening"].indexOf(qp) >= 0) forced = qp;
}catch(e){}

/* ── which daypart is it ────────────────────────────────────────────────────
   Boundaries are computed from the alarm, not hardcoded, so moving the alarm
   moves dawn with it. */
function partNow(D){
  if (forced) return forced;
  var a = D.alarm || {hour:6, minute:30, sunrise_minutes:25};
  var n = new Date();
  var mins = n.getHours()*60 + n.getMinutes();
  var alarm = a.hour*60 + a.minute;
  var ramp  = a.sunrise_minutes || 25;
  if (mins >= alarm - ramp && mins < alarm + 90) return "dawn";
  if (mins >= alarm + 90 && mins < 17*60) return "day";
  if (mins >= 17*60 && mins < 22*60) return "evening";
  return "night";
}

/* ── the lamp. identical curve to the shipped alarm's ramp. ─────────────── */
function paintLight(D, part){
  var a = D.alarm || {hour:6, minute:30, sunrise_minutes:25};
  var ramp = a.sunrise_minutes || 25;
  var n = new Date();
  var t = new Date(); t.setHours(a.hour, a.minute, 0, 0);
  if (t <= n) t.setDate(t.getDate() + 1);
  var left = Math.round((t - n) / 60000);

  var sun = document.getElementById("sunrise");
  var dsk = document.getElementById("dusk");
  if (forced === "dawn"){ sun.style.opacity = 0.72; }
  else if (part === "dawn" || (part === "night" && left <= ramp)){
    var p = left <= ramp ? 1 - (left / ramp) : 1;
    sun.style.opacity = (Math.min(1, p*p) * 0.92).toFixed(3);
  } else sun.style.opacity = 0;
  dsk.style.opacity = (part === "evening" || forced === "evening") ? 0.85 : 0;
  return left;
}

HQ.everySecond(function(){
  var n = new Date(), h = n.getHours();
  document.getElementById("clock").innerHTML =
    (h % 12 || 12) + ":" + two(n.getMinutes()) +
    '<span class="mer">' + (h >= 12 ? "pm" : "am") + '</span>';
});

function rows(list, n, fn, noun){
  return list.slice(0,n).map(fn).join("") +
    (list.length > n ? '<div class="more mono">and ' + (list.length-n) + ' more ' + (noun||"") + '</div>' : "");
}

function render(){
  var D = HQ.data();
  var n = new Date();
  var part = partNow(D);
  document.documentElement.dataset.part = part;
  document.getElementById("partChip").textContent = part;

  var left = paintLight(D, part);
  var a = D.alarm || {hour:6, minute:30};
  document.getElementById("alarmLine").innerHTML =
    'alarm <b>' + (a.hour % 12 || 12) + ':' + two(a.minute) + (a.hour>=12?'pm':'am') + '</b> · in ' +
    Math.floor(left/60) + 'h ' + (left%60) + 'm';

  document.getElementById("dateline").innerHTML =
    "<b>" + n.toLocaleDateString(undefined,{weekday:"long"}).toLowerCase() + "</b> · " +
    n.toLocaleDateString(undefined,{month:"long",day:"numeric"}).toLowerCase() +
    " · Arlington " + HQ.field("weather", D.weather && D.weather.value,
      {needs:"one free forecast call for Arlington, once an hour. not wired yet"});

  document.getElementById("sNight").style.display = part === "night" ? "flex" : "none";
  document.getElementById("sDawn").style.display  = part === "dawn"  ? "flex" : "none";
  document.getElementById("sWork").style.display  =
    (part === "day" || part === "evening") ? "grid" : "none";

  var deadlines = (D.deadlines||[]).slice().sort(function(x,y){
    return HQ.daysFromToday(x.on) - HQ.daysFromToday(y.on); });
  var lead = deadlines[0];
  var todos = D.todos || [];
  var evs = (D.events||[]).map(function(e){ return {t:e.title, s:new Date(e.start), e:new Date(e.end)}; });
  var todayEvs = evs.filter(function(e){ return e.s.toDateString() === n.toDateString(); })
                    .sort(function(x,y){ return x.s - y.s; });
  var tm = new Date(); tm.setDate(tm.getDate()+1);
  var tmEvs = evs.filter(function(e){ return e.s.toDateString() === tm.toDateString(); })
                 .sort(function(x,y){ return x.s - y.s; });
  var out = (D.bills||[]).filter(function(b){ return !b.paid; })
    .sort(function(x,y){ return HQ.daysFromToday(x.due) - HQ.daysFromToday(y.due); });

  /* ── SCN-02 · NIGHT. deliberately almost empty. ──────────────────────── */
  document.getElementById("nUntil").textContent =
    Math.floor(left/60) + "h " + (left%60) + "m until the sun comes up";
  document.getElementById("nBig").textContent = lead ? lead.name : "nothing waiting";
  document.getElementById("nSmall").textContent =
    "that is the first thing tomorrow. everything else is off this screen until then.";

  /* ── SCN-03 · DAWN. one thing, one number. ───────────────────────────── */
  if (lead){
    document.getElementById("dSay").textContent = lead.name;
    document.getElementById("dWhy").textContent = lead.why || "";
  }
  var latest = out.filter(function(b){ return HQ.daysFromToday(b.due) < 0; })[0];
  document.getElementById("dNums").innerHTML = latest
    ? HQ.esc(latest.name) + " is " + HQ.dueText(latest.due) +
      (latest.hard_date ? " · " + HQ.daysFromToday(latest.hard_date) + " days until it " +
        HQ.esc(latest.hard_label||"counts") : "")
    : todayEvs.length + " on the books today";

  /* ── SCN-04 · DAY and EVENING share a frame, never the content ───────── */
  var evening = part === "evening";

  document.getElementById("wLead1").textContent = evening ? "before you stop" : "do this next";
  if (lead){
    document.getElementById("wLead").textContent = lead.name;
    document.getElementById("wWhy").textContent = lead.why || "";
    document.getElementById("wLeadAge").textContent = HQ.fresh(lead.source || "commitments").age;
  }
  var q = evening
    ? todos.filter(function(t){ return t.when === "today"; })
    : todos.filter(function(t){ return t.when === "today"; })
        .concat(todos.filter(function(t){ return t.when === "this week"; }));
  document.getElementById("wQueue").innerHTML = q.length
    ? rows(q, evening ? 4 : 6, function(t){
        return '<div class="row"><span class="nm">' + HQ.esc(t.text) + '</span>' +
          '<span class="st">' + HQ.esc(t.when) + '</span></div>'; }, "on the list")
    : '<div class="more mono">nothing on the list</div>';

  /* middle panel: today while it is day, tomorrow once the evening starts */
  var midList = evening ? tmEvs : todayEvs;
  document.getElementById("wMidLab").textContent = evening ? "tomorrow" : "today";
  document.getElementById("wMidCount").textContent = midList.length;
  document.getElementById("wMid").innerHTML = midList.length
    ? rows(midList, 7, function(e){
        var running = e.s <= n && e.e > n;
        var mm = Math.round((e.s - n)/60000);
        var w = running ? "now" : mm < 0 ? "done"
          : mm < 60 ? "in " + mm + "m" : HQ.clockOf(e.s);
        return '<div class="row"><span class="nm">' + HQ.esc(e.t) + '</span>' +
          '<span class="st ' + (running ? "now" : "") + '">' + w + '</span></div>'; })
    : '<div class="more mono">nothing on the books. no calendar is connected yet.</div>';

  /* right panel: money out by day, or in the evening, what is left to pay today */
  document.getElementById("wRightLab").textContent = evening ? "still unpaid" : "money out";
  var rightList = evening
    ? out.filter(function(b){ return HQ.daysFromToday(b.due) <= 3; })
    : out;
  document.getElementById("wRightCount").textContent = rightList.length;
  document.getElementById("wRight").innerHTML = rightList.length
    ? rows(rightList, 7, function(b){
        var d = HQ.daysFromToday(b.due);
        return '<div class="row"><span class="nm">' + HQ.esc(b.name) + '</span>' +
          '<span class="st ' + (d < 0 ? "late" : d <= 3 ? "now" : "") + '">' +
          (HQ.money(b.amount) || "?") + " · " + HQ.dueText(b.due) + '</span></div>'; })
    : '<div class="more mono">nothing due in the next three days</div>';
}

HQ.boot(render);
HQ.refreshLine(document.getElementById("refresh"));

/* ── the review bar ─────────────────────────────────────────────────────── */
if (forced){
  document.querySelectorAll("#bar button[data-set]").forEach(function(x){
    x.classList.toggle("on", x.dataset.set === forced); });
}
document.querySelectorAll("#bar button[data-set]").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll("#bar button[data-set]").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    forced = b.dataset.set === "auto" ? null : b.dataset.set;
    render();
  });
});
document.getElementById("ramp").addEventListener("click", function(){
  var s = document.getElementById("sunrise");
  s.style.transition = "opacity 6s linear"; s.style.opacity = 0.92;
  setTimeout(function(){ s.style.transition = "opacity 1.4s linear"; render(); }, 6500);
});

/* ── AUDIO SESSION. reproduced from the shipped index.html, v7. ────────────
   Do NOT simplify this. The root cause was found in WebKit source: a page whose
   only audio is Web Audio falls through to the AmbientSound category, which Apple
   silences on the ring switch AND on screen lock. Setting audioSession.type to
   "playback" sets a categoryOverride that WebKit checks first. It is EXCLUSIVE,
   so it is claimed only when sound is actually wanted and released otherwise, or
   opening a dashboard would pause his music.
   This page makes no sound of its own. The hook is kept so that a future version
   which does can reuse the fix instead of rediscovering it. */
function claimPlaybackSession(){
  try{ if ("audioSession" in navigator) navigator.audioSession.type = "playback"; }catch(e){}
}
function releasePlaybackSession(){
  try{ if ("audioSession" in navigator) navigator.audioSession.type = "auto"; }catch(e){}
}
window.HQ_AUDIO = { claim: claimPlaybackSession, release: releasePlaybackSession };

setTimeout(function(){
  var el = document.getElementById("clock");
  if (el && el.textContent.indexOf("--") === 0)
    document.getElementById("dateline").textContent =
      "data did not load. run python3 make-data.py in this folder.";
}, 2500);
</script>
