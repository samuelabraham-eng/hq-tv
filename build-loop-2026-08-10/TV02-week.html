<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f12">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>TV02 · the week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   TV02 · the week
   The Toggl style week grid he sent, built for a room rather than a laptop.
   Point of view: a week grid on a TV is not a planner, it is a horizon. So the
   grid is drawn only across the hours that actually contain something, the now
   line moves in real time, and a rail on the right answers the only question a
   glance ever asks, which is what is next and how long have I got.
   Nothing is tappable. Cold ink palette on purpose, so it does not read as TV01
   in different colours.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --ground:#0a0f12; --panel:#101a1f; --panel2:#142127; --line:#1d2c34; --line2:#16232a;
  --bone:#e9eef0; --dim:#7d8f97; --faint:#4f6169;
  --amber:#e0a34a; --alert:#e0533b; --ok:#7fb08e;
  --k-money:#c9903c; --k-client:#5f8fb0; --k-school:#6e9c72; --k-work:#9a7fb0; --k-personal:#7d8f97;
  --safe:1.9vw; --gap:.8vw;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;max-width:100%}
body{
  background:
    radial-gradient(100% 80% at 50% -10%, #14212a 0%, rgba(20,33,42,0) 60%),
    var(--ground);
  color:var(--bone);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.03;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

#board{position:relative;z-index:2;height:100%;padding:var(--safe);
  display:flex;flex-direction:column;gap:var(--gap)}
.hq-sample #board{padding-bottom:calc(var(--safe) + 2.6em)}

/* ── SCN-01 · the head ───────────────────────────────────────────────────── */
.head{display:grid;grid-template-columns:auto 1fr auto;gap:1.4vw;align-items:end;
  border-bottom:1px solid var(--line);padding-bottom:.6vw}
.wknum{font-size:clamp(22px,min(3.4vw,6vh),58px);font-weight:800;letter-spacing:-.045em;line-height:.9}
.wknum span{color:var(--dim);font-weight:500}
.eyebrow{font-size:clamp(8px,min(.8vw,1.5vh),12px);letter-spacing:.24em;font-weight:700;
  color:var(--amber);text-transform:uppercase}
.headmid{min-width:0}
.nowline{font-size:clamp(10px,min(1.1vw,2vh),17px);color:var(--dim);font-weight:500}
.nowline b{color:var(--bone);font-weight:700}
.refresh{font-size:clamp(8.5px,min(.92vw,1.7vh),13px);color:var(--faint);display:flex;align-items:center}
.headright{text-align:right}
.srcwarn{font-size:clamp(8.5px,min(.92vw,1.72vh),13px);color:#b3823f;font-weight:600;
  line-height:1.35;max-width:34ch;text-align:right}

/* ── the two surfaces ────────────────────────────────────────────────────── */
.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 20.5vw;gap:var(--gap)}

/* ── SCN-02 · the week grid ──────────────────────────────────────────────── */
.cal{position:relative;min-height:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:3px;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 18px 40px -30px #000}
.days{display:grid;grid-template-columns:3.4vw repeat(7,1fr);border-bottom:1px solid var(--line);
  flex-shrink:0}
.dh{padding:.4vw .5vw;text-align:center;border-left:1px solid var(--line2);min-width:0}
.dh:first-child{border-left:none}
.dh .dow{font-size:clamp(8px,min(.82vw,1.55vh),12px);letter-spacing:.18em;font-weight:700;
  color:var(--faint);text-transform:uppercase}
.dh .dnum{font-size:clamp(13px,min(1.55vw,2.9vh),26px);font-weight:800;letter-spacing:-.03em;
  line-height:1.1}
.dh.today{background:linear-gradient(180deg,rgba(224,163,74,.16),rgba(224,163,74,0))}
.dh.today .dow{color:var(--amber)}
.dh.past .dnum,.dh.past .dow{opacity:.4}

.gridwrap{flex:1;min-height:0;position:relative;display:grid;
  grid-template-columns:3.4vw repeat(7,1fr)}
.hours{position:relative;border-right:1px solid var(--line2)}
.hr{position:absolute;left:0;right:0;font-size:clamp(7.5px,min(.8vw,1.5vh),11px);
  color:var(--faint);text-align:right;padding-right:.35vw;transform:translateY(-.5em);
  font-weight:600;letter-spacing:.02em}
.col{position:relative;border-left:1px solid var(--line2);min-width:0;z-index:2}
.col.today{background:rgba(224,163,74,.045)}
.col.weekend{background:rgba(255,255,255,.012)}
/* The hour rules, drawn once across the whole grid, UNDER the blocks.
   Round 1 inserted the columns before this node, so every rule painted on top and
   struck a line through the event titles. A line through a calendar entry means
   cancelled. This is a meaning inversion, not a cosmetic bug. z-index fixes it
   without depending on DOM order. */
.rules{position:absolute;inset:0;pointer-events:none;grid-column:2/-1;z-index:0}
.rules i{position:absolute;left:0;right:0;height:1px;background:var(--line2)}

/* explicit rgba rather than color-mix: Fire TV browsers run behind desktop Chrome
   and color-mix only landed in Chrome 111. A missing background here would make
   every block invisible, which is the worst possible failure on a wall screen. */
.ev{position:absolute;left:2%;right:2%;border-radius:2px;overflow:hidden;
  padding:.25vw .4vw;display:flex;flex-direction:column;gap:.05vw;
  border-left:3px solid var(--k);background:var(--kbg);
  min-height:3.4vh}
.ev.tight .et{-webkit-line-clamp:1}
.ev.tight .eh{display:none}
.ev .et{font-size:clamp(8px,min(.88vw,1.65vh),13px);font-weight:700;letter-spacing:-.01em;
  line-height:1.14;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev .eh{font-size:clamp(7px,min(.75vw,1.4vh),10px);color:var(--dim);font-weight:600;
  white-space:nowrap;overflow:hidden}
/* a block HQ actually knows about is solid. a block that is only a shape is hatched. */
.ev.shape{background:repeating-linear-gradient(135deg,var(--kbg) 0 6px, transparent 6px 12px);
  border-left-style:dashed;opacity:.72}
.ev.real::after{content:"";position:absolute;top:.2vw;right:.25vw;width:.35vw;height:.35vw;
  min-width:4px;min-height:4px;border-radius:50%;background:var(--k)}
/* A real block is OPAQUE. Round 1 filled it with a 22% alpha wash, so the hour
   rules and the now line showed straight through it and read as a line struck
   through the title. A hatched shape stays translucent on purpose: a shape is not
   a commitment, and it is allowed to have the grid visible behind it. */
.ev:not(.shape){background-color:#1a262d;background-image:linear-gradient(var(--kbg),var(--kbg))}
.ev.past{opacity:.34}

/* The now line. It moves. It is the only thing on this page that is red.
   It sits UNDER the blocks for the same reason the hour rules do, and its dot and
   label ride above everything in the gutter so it is never lost. */
#now{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--alert);
  z-index:1;pointer-events:none;grid-column:2/-1;opacity:.85}
#now::before{content:"";position:absolute;left:-3px;top:-4px;width:7px;height:7px;
  border-radius:50%;background:var(--alert);z-index:7}
#nowlab{position:absolute;left:-3.2vw;top:-.62em;font-size:clamp(7.5px,min(.8vw,1.5vh),11px);
  color:var(--alert);font-weight:700;letter-spacing:.06em;z-index:7;
  background:var(--panel);padding:0 .25em;border-radius:2px}

/* ── SCN-03 · what is next. a spine, not a list of cards. ────────────────── */
.rail{min-height:0;display:flex;flex-direction:column;gap:.5vw;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:3px;padding:.8vw .9vw;overflow:hidden}
.spine{flex:1;min-height:0;position:relative;padding-left:1.5vw;overflow:hidden}
.spine::before{content:"";position:absolute;left:.42vw;top:.4vw;bottom:.4vw;width:1px;
  background:linear-gradient(180deg,var(--amber),rgba(224,163,74,.08))}
.node{position:relative;padding:.42vw 0;border-bottom:1px solid rgba(255,255,255,.045)}
.node:last-child{border-bottom:none}
.node::before{content:"";position:absolute;left:-1.29vw;top:.85vw;width:.55vw;height:.55vw;
  min-width:7px;min-height:7px;border-radius:50%;background:var(--ground);
  border:2px solid var(--k,var(--amber))}
.node.first::before{background:var(--amber);border-color:var(--amber);
  box-shadow:0 0 0 .28vw rgba(224,163,74,.16)}
.node .nt{font-size:clamp(10px,min(1.08vw,2.05vh),17px);font-weight:700;letter-spacing:-.015em;
  line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.node .nw{font-size:clamp(8.5px,min(.92vw,1.72vh),13px);color:var(--dim);font-weight:600;margin-top:.1vw}
.node .nw b{color:var(--amber);font-weight:700}
.node.first .nt{font-size:clamp(12px,min(1.35vw,2.5vh),22px)}
/* The rail is the part a glance actually reads at ten feet, so the real / shape
   distinction has to live HERE too, not only in the grid legend. Round 1 set its
   number one item largest and gold while that item was invented. */
.node.shape .nt{opacity:.78}
.node.shape::before{border-style:dashed;background:transparent}
.node.first.shape::before{background:transparent;box-shadow:none}
.tag{display:inline-block;margin-left:.45em;padding:0 .4em;border-radius:2px;
  font-size:clamp(7.5px,min(.72vw,1.35vh),10.5px);font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;vertical-align:.14em;white-space:nowrap}
.tag.shape{border:1px dashed var(--faint);color:var(--dim)}
.tag.real{border:1px solid rgba(127,176,142,.5);color:var(--ok)}
.more{font-size:clamp(8.5px,min(.9vw,1.7vh),13px);color:var(--faint);font-weight:600;padding-top:.3vw}

.kinds{display:flex;gap:.7vw;flex-wrap:wrap;font-size:clamp(7.5px,min(.8vw,1.5vh),11px);
  color:var(--faint);font-weight:600;letter-spacing:.06em;flex-shrink:0;
  border-top:1px solid var(--line);padding-top:.4vw}
.kinds i{font-style:normal;display:inline-flex;align-items:center;gap:.3em}
.kinds b{width:.55em;height:.55em;border-radius:1px;display:inline-block}

/* ── SCN-04 · the day list, phones only ──────────────────────────────────── */
.daylist{display:none}

/* an iPad in landscape is 1024 wide and CAN hold the real grid, so the day list
   does not take over until a genuinely narrow screen. */
@media (max-width:1180px) and (min-width:901px){
  :root{--safe:14px;--gap:9px}
  .body{grid-template-columns:1fr 27vw}
  .wknum{font-size:clamp(20px,3.2vw,34px)}
  .srcwarn{max-width:30ch}
}
@media (max-width:900px){
  :root{--safe:16px;--gap:12px}
  html,body{overflow:auto;height:auto}
  #board{height:auto;min-height:100%}
  .head{grid-template-columns:1fr;gap:8px;align-items:start}
  .headright{text-align:left} .srcwarn{text-align:left;max-width:none}
  .body{grid-template-columns:1fr}
  .cal{display:none}            /* a 7 column hour grid is unreadable on a phone */
  /* order: the head stays first, then the day list, then what is next */
  .daylist{display:flex;flex-direction:column;gap:14px;order:0}
  .body{order:1}
  .rail{padding:14px}
  .spine{padding-left:22px} .spine::before{left:6px}
  .node::before{left:-19px;top:14px;width:9px;height:9px}
  .wknum{font-size:30px}
  .hq-sample #board{padding-bottom:130px}
}

/* the phone view: one block per day, in order, with the hours as text */
.dl{border:1px solid var(--line);border-radius:3px;overflow:hidden;
  background:linear-gradient(180deg,var(--panel2),var(--panel))}
.dl h4{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:9px 12px;border-bottom:1px solid var(--line);font-size:15px;font-weight:800;
  letter-spacing:-.02em}
.dl h4 span{font-size:11px;letter-spacing:.16em;color:var(--faint);font-weight:700}
.dl.today h4{background:rgba(224,163,74,.12)} .dl.today h4 span{color:var(--amber)}
.dl .dr{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line2);
  border-left:3px solid var(--k);font-size:14px;align-items:baseline}
.dl .dr:last-child{border-bottom:none}
.dl .dr .dt{font-size:11.5px;color:var(--dim);font-weight:700;white-space:nowrap;min-width:9ch}
.dl .dr.shape{opacity:.66;border-left-style:dashed}
.dl .empty{padding:8px 12px;font-size:13px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<main id="board">

  <!-- SCN-01 · HEAD -->
  <header class="head">
    <div>
      <div class="eyebrow mono">the week of</div>
      <div class="wknum" id="wkTitle">&nbsp;</div>
    </div>
    <div class="headmid">
      <div class="nowline" id="nowText">&nbsp;</div>
      <div class="refresh mono" id="refresh">&nbsp;</div>
    </div>
    <div class="headright">
      <div class="eyebrow mono" style="color:var(--faint)">calendar source</div>
      <div class="srcwarn" id="srcWarn">&nbsp;</div>
    </div>
  </header>

  <div class="body">

    <!-- SCN-02 · THE WEEK GRID -->
    <section class="cal">
      <div class="days" id="dayHeads"></div>
      <div class="gridwrap" id="gridWrap">
        <div class="hours" id="hours"></div>
        <div class="rules" id="rules"></div>
        <div id="now" style="display:none"><span id="nowlab" class="mono"></span></div>
      </div>
    </section>

    <!-- SCN-03 · WHAT IS NEXT -->
    <aside class="rail">
      <div class="eyebrow mono">what is next</div>
      <div class="spine" id="spine"></div>
      <div class="kinds mono" id="kinds"></div>
    </aside>
  </div>

  <!-- SCN-04 · THE DAY LIST, phones only -->
  <div class="daylist" id="dayList"></div>
</main>

<!-- data.local.js is his real numbers. it is gitignored and is missing on a fresh
     clone, where this tag 404s harmlessly and the committed sample below takes over. -->
<script src="data.local.js"></script>
<script src="data.js"></script>
<script src="hq-core.js"></script>
<script>
"use strict";

var DOW = ["sun","mon","tue","wed","thu","fri","sat"];
var KIND = {money:"--k-money",client:"--k-client",school:"--k-school",
            work:"--k-work",personal:"--k-personal"};
var KBG = {money:"rgba(201,144,60,.22)", client:"rgba(95,143,176,.20)",
           school:"rgba(110,156,114,.20)", work:"rgba(154,127,176,.20)",
           personal:"rgba(125,143,151,.16)"};

function kcol(k){ return "var(" + (KIND[k] || "--k-personal") + ")"; }
function kbg(k){ return KBG[k] || KBG.personal; }
function kvars(k){ return "--k:" + kcol(k) + ";--kbg:" + kbg(k) + ";"; }
function midnight(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }

function render(){
  var D = HQ.data();
  var evs = (D.events || []).map(function(e){
    return { t:e.title, s:new Date(e.start), e:new Date(e.end), k:e.kind,
             real:!!e.real, why:e.why || "", src:e.source };
  }).filter(function(e){ return !isNaN(e.s) && !isNaN(e.e); });

  var now = new Date();

  /* the week runs Sunday to Saturday around today */
  var start = midnight(now); start.setDate(start.getDate() - start.getDay());
  var week = []; for (var i=0;i<7;i++){ var d = new Date(start); d.setDate(d.getDate()+i); week.push(d); }
  var endOfWeek = new Date(week[6]); endOfWeek.setHours(23,59,59,999);

  document.getElementById("wkTitle").innerHTML =
    week[0].toLocaleDateString(undefined,{month:"long",day:"numeric"}).toLowerCase() +
    ' <span>to ' + week[6].toLocaleDateString(undefined,{month:"short",day:"numeric"}).toLowerCase() + '</span>';

  /* ── SCN-01 · the live now line, in words ─────────────────────────────── */
  var inWeek = evs.filter(function(e){ return e.e >= start && e.s <= endOfWeek; });
  var future = evs.filter(function(e){ return e.s > now; })
                  .sort(function(a,b){ return a.s - b.s; });
  var running = evs.find(function(e){ return e.s <= now && e.e > now; });

  var nt = document.getElementById("nowText");
  if (running){
    var leftM = Math.round((running.e - now)/60000);
    nt.innerHTML = "right now · <b>" + HQ.esc(running.t) + "</b> · " + leftM + " minutes left";
  } else if (future.length){
    var gap = Math.round((future[0].s - now)/60000);
    var gtxt = gap < 60 ? gap + " minutes" : Math.floor(gap/60) + "h " + (gap%60) + "m";
    nt.innerHTML = "nothing running · next is <b>" + HQ.esc(future[0].t) + "</b> in " + gtxt;
  } else {
    nt.innerHTML = "nothing running · nothing else this week that HQ knows about";
  }

  var cf = HQ.fresh("calendar");
  document.getElementById("srcWarn").innerHTML = cf.state === "unknown"
    ? "no calendar is connected. the solid blocks are the two things HQ genuinely knows. " +
      "the hatched blocks are shapes, so you can see the grid working."
    : "connected · " + HQ.esc(cf.age);

  /* ── SCN-02 · the grid. only the hours that hold something ────────────── */
  var lo = 24, hi = 0;
  inWeek.forEach(function(e){
    lo = Math.min(lo, e.s.getHours());
    hi = Math.max(hi, e.e.getHours() + (e.e.getMinutes() ? 1 : 0));
  });
  if (lo > hi){ lo = 8; hi = 20; }
  lo = Math.max(0, lo - 1); hi = Math.min(24, hi + 1);
  if (hi - lo < 6){ hi = Math.min(24, lo + 6); }
  var span = (hi - lo) * 60;

  var heads = document.getElementById("dayHeads");
  heads.innerHTML = '<div class="dh"></div>' + week.map(function(d){
    var isToday = d.toDateString() === now.toDateString();
    var past = d < midnight(now);
    return '<div class="dh' + (isToday ? " today" : past ? " past" : "") + '">' +
      '<div class="dow mono">' + DOW[d.getDay()] + '</div>' +
      '<div class="dnum">' + d.getDate() + '</div></div>';
  }).join("");

  var hours = document.getElementById("hours");
  var hh = "";
  for (var h = lo; h < hi; h++){
    var top = ((h - lo) * 60 / span) * 100;
    var lbl = (h % 12 || 12) + (h >= 12 && h < 24 ? "p" : "a");
    if (h === 24) lbl = "12a";
    hh += '<div class="hr mono" style="top:' + top.toFixed(2) + '%">' + lbl + '</div>';
  }
  hours.innerHTML = hh;

  var rules = document.getElementById("rules");
  var rr = "";
  for (var h2 = lo; h2 <= hi; h2++){
    rr += '<i style="top:' + (((h2-lo)*60/span)*100).toFixed(2) + '%"></i>';
  }
  rules.innerHTML = rr;

  /* one column per day, events positioned by real minutes */
  var wrap = document.getElementById("gridWrap");
  wrap.querySelectorAll(".col").forEach(function(c){ c.remove(); });
  week.forEach(function(d){
    var col = document.createElement("div");
    var isToday = d.toDateString() === now.toDateString();
    col.className = "col" + (isToday ? " today" : "") +
      (d.getDay() === 0 || d.getDay() === 6 ? " weekend" : "");
    var mine = inWeek.filter(function(e){ return e.s.toDateString() === d.toDateString(); })
                     .sort(function(a,b){ return a.s - b.s; });
    col.innerHTML = mine.map(function(e){
      var s = (e.s.getHours()*60 + e.s.getMinutes()) - lo*60;
      var en = (e.e.getHours()*60 + e.e.getMinutes()) - lo*60;
      var top = Math.max(0, s / span * 100);
      var hgt = Math.max(2.2, (en - s) / span * 100);
      var tight = (en - s) <= 45;
      return '<div class="ev ' + (e.real ? "real" : "shape") + (e.e < now ? " past" : "") +
        (tight ? " tight" : "") +
        '" style="' + kvars(e.k) + 'top:' + top.toFixed(2) + '%;height:' + hgt.toFixed(2) + '%">' +
        '<div class="et">' + HQ.esc(e.t) + '</div>' +
        '<div class="eh mono">' + HQ.clockOf(e.s) + '</div></div>';
    }).join("");
    wrap.insertBefore(col, document.getElementById("rules"));
  });

  /* the now line, positioned from the actual clock */
  var nEl = document.getElementById("now");
  var mins = now.getHours()*60 + now.getMinutes();
  if (mins >= lo*60 && mins <= hi*60){
    nEl.style.display = "block";
    nEl.style.top = (((mins - lo*60) / span) * 100).toFixed(3) + "%";
    document.getElementById("nowlab").textContent = HQ.clockOf(now);
  } else { nEl.style.display = "none"; }

  /* ── SCN-03 · the spine ──────────────────────────────────────────────── */
  var queue = future.slice();
  // dated commitments belong in "what is next" even with no calendar behind them
  (D.deadlines || []).forEach(function(x){
    var dd = HQ.daysFromToday(x.on);
    if (dd !== null && dd >= 0) queue.push({ t:x.name, s:new Date(x.on + "T09:00:00"),
      k:"money", real:true, deadline:true });
  });
  queue.sort(function(a,b){ return a.s - b.s; });
  var show = queue.slice(0,7);
  document.getElementById("spine").innerHTML = show.map(function(e,i){
    var when = HQ.gapText(e.s - now);
    return '<div class="node' + (i===0 ? " first" : "") + (e.real ? "" : " shape") +
      '" style="' + kvars(e.k) + '">' +
      '<div class="nt">' + HQ.esc(e.t) +
      '<span class="tag ' + (e.real ? "real" : "shape") + '">' +
      (e.real ? "HQ knows this" : "a shape only") + '</span></div>' +
      '<div class="nw mono"><b>' + when + '</b> · ' +
      (e.deadline ? "a dated commitment" : HQ.clockOf(e.s) + " " + DOW[e.s.getDay()]) + '</div></div>';
  }).join("") + (queue.length > show.length
    ? '<div class="more mono">and ' + (queue.length - show.length) + ' more this week</div>'
    : (show.length ? "" : '<div class="more mono">nothing ahead that HQ knows about</div>'));

  document.getElementById("kinds").innerHTML =
    Object.keys(KIND).map(function(k){
      return '<i><b style="background:' + kcol(k) + '"></b>' + k + '</i>';
    }).join("") + '<i style="opacity:.7">solid = HQ knows it · hatched = a shape only</i>';

  /* ── SCN-04 · the phone day list ─────────────────────────────────────── */
  document.getElementById("dayList").innerHTML = week.map(function(d){
    var isToday = d.toDateString() === now.toDateString();
    var mine = inWeek.filter(function(e){ return e.s.toDateString() === d.toDateString(); })
                     .sort(function(a,b){ return a.s - b.s; });
    if (!mine.length && !isToday) return "";
    return '<div class="dl' + (isToday ? " today" : "") + '">' +
      '<h4>' + d.toLocaleDateString(undefined,{weekday:"long"}).toLowerCase() +
      '<span class="mono">' + (isToday ? "today · " : "") +
      d.toLocaleDateString(undefined,{month:"short",day:"numeric"}).toLowerCase() + '</span></h4>' +
      (mine.length ? mine.map(function(e){
        return '<div class="dr ' + (e.real ? "real" : "shape") + '" style="' + kvars(e.k) + '">' +
          '<span class="dt mono">' + HQ.clockOf(e.s) + '</span>' +
          '<span>' + HQ.esc(e.t) +
          '<span class="tag ' + (e.real ? "real" : "shape") + '">' +
          (e.real ? "HQ knows this" : "a shape only") + '</span></span></div>';
      }).join("") : '<div class="empty">nothing on the books</div>') + '</div>';
  }).join("");
}

HQ.boot(render);
HQ.refreshLine(document.getElementById("refresh"));
/* the now line and the countdowns must move without waiting for the slow render */
HQ.everySecond(function(){
  var el = document.getElementById("nowlab");
  if (el && el.textContent) el.textContent = HQ.clockOf(new Date());
});
setTimeout(function(){
  var s = document.getElementById("spine");
  if (s && !s.innerHTML.trim())
    s.innerHTML = '<div class="more mono">data did not load. run python3 make-data.py in this folder.</div>';
}, 2500);
</script>
</body>
