<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ece5d6">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>TV06 · the board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   TV06 · the board
   The to do list and the reminders, as a printed agenda page rather than a
   dashboard. The only LIGHT screen in this loop, because he said plainly that
   cream and noir are the two he likes and that a lighter theme reads better.
   Point of view: a list is not a grid of cards. It is a ruled page with a
   hierarchy: today is set large enough to read across a room, this week is an
   index, and everything past that stays in HQ where it belongs.
   Source of truth is life/TODO.md, read by make-data.py.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#ece5d6; --card:#f7f2e7; --card2:#f2ecdd; --rule:#d6cbb3; --rule2:#e2d9c5;
  --ink:#171310; --dim:#6d6353; --faint:#9a8f7b;
  --gold:#9c7a34; --red:#b3341f; --green:#4a7350; --blue:#3f5f7a;
  --safe:2.2vw; --gap:1vw;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;max-width:100%}
body{
  background:
    radial-gradient(120% 90% at 15% 0%, #f3ecdd 0%, rgba(243,236,221,0) 55%),
    var(--paper);
  color:var(--ink);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* paper tooth. a light screen with no texture is the flattest thing there is. */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.05;
  mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

#board{position:relative;z-index:2;height:100%;padding:var(--safe);
  display:flex;flex-direction:column;gap:var(--gap)}
.hq-sample #board{padding-bottom:calc(var(--safe) + 2.6em)}
.eyebrow{font-size:clamp(8px,min(.82vw,1.55vh),12px);letter-spacing:.26em;font-weight:700;
  color:var(--gold);text-transform:uppercase}

/* ── SCN-01 · the masthead, set like a page header ───────────────────────── */
.head{display:grid;grid-template-columns:1fr auto;gap:1.4vw;align-items:end;
  border-bottom:2px solid var(--ink);padding-bottom:.5vw;flex-shrink:0}
.title{font-size:clamp(22px,min(3.2vw,5.6vh),56px);font-weight:800;letter-spacing:-.045em;
  line-height:.95}
.title em{font-style:normal;color:var(--faint);font-weight:500}
.dateline{font-size:clamp(10px,min(1.1vw,2vh),17px);color:var(--dim);font-weight:600;margin-top:.2vw}
.headright{text-align:right}
.count{font-size:clamp(16px,min(2.2vw,4vh),36px);font-weight:800;letter-spacing:-.04em;line-height:1}
.count u{text-decoration:none;color:var(--red)}
.refresh{font-size:clamp(8.5px,min(.9vw,1.7vh),13px);color:var(--faint);display:flex;
  align-items:center;justify-content:flex-end;margin-top:.2vw}

/* Round 2: this was three top-aligned columns and roughly 55% empty cream below
   them. He has said repeatedly that he wants MORE on screen because the TV is very
   big. So the page now runs two bands: the lists on top, and the seven day agenda
   underneath, which is the thing a paper agenda page would actually carry. */
.body{flex:1;min-height:0;display:grid;grid-template-columns:1.6fr 1fr .95fr;
  grid-template-rows:1.15fr .85fr;gap:var(--gap) var(--gap)}
.col{min-height:0;display:flex;flex-direction:column;gap:.4vw;overflow:hidden}
.col > .today,.col > .week,.col > .rem{flex:1 1 auto}
.colhead{display:flex;justify-content:space-between;align-items:baseline;gap:.7vw;
  border-bottom:1px solid var(--rule);padding-bottom:.25vw;flex-shrink:0}

/* ── SCN-02 · TODAY. large, ruled, numbered. readable across a room. ─────── */
.today{display:flex;flex-direction:column;min-height:0;overflow:hidden}
/* Round 1 drew an empty checkbox beside every row. Nothing on this screen is ever
   tapped, so a checkbox promises an interaction that does not exist. His words:
   "realistically on a TV, I'm not tapping anything." It is a printed agenda line
   now: a rule, a number, the item, its area. */
.tk{display:grid;grid-template-columns:auto 1fr auto;gap:.8vw;align-items:baseline;
  padding:.5vw 0 .5vw .8vw;border-bottom:1px solid var(--rule2);
  border-left:3px solid var(--rule)}
.tk:last-child{border-bottom:none}
.tk .n{font-family:"JetBrains Mono",monospace;font-size:clamp(9px,min(1vw,1.85vh),14px);
  font-weight:700;color:var(--faint)}
.tk .t{font-size:clamp(13px,min(1.7vw,3.1vh),30px);font-weight:700;letter-spacing:-.025em;
  line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tk .a{font-size:clamp(8px,min(.85vw,1.6vh),12px);letter-spacing:.18em;font-weight:700;
  color:var(--gold);text-transform:uppercase;white-space:nowrap}
.tk.hot{border-left-color:var(--red)}
.tk.hot .t{color:var(--red)}
.tk.hot .n{color:var(--red)}

/* ── SCN-07 · THE SEVEN DAY AGENDA. the bottom band. ─────────────────────── */
.agenda{grid-column:1/-1;min-height:0;display:flex;flex-direction:column;gap:.35vw;
  border-top:2px solid var(--ink);padding-top:.45vw}
.days{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:0}
.dy{min-width:0;overflow:hidden;padding:.25vw .7vw;border-left:1px solid var(--rule2)}
.dy:first-child{border-left:none;padding-left:0}
.dy.today{background:linear-gradient(180deg,rgba(156,122,52,.11),rgba(156,122,52,0))}
.dy .dh{display:flex;align-items:baseline;gap:.4em;border-bottom:1px solid var(--rule);
  padding-bottom:.14vw;margin-bottom:.2vw}
.dy .dow{font-size:clamp(7.5px,min(.8vw,1.5vh),11px);letter-spacing:.18em;font-weight:700;
  color:var(--faint);text-transform:uppercase}
.dy.today .dow{color:var(--gold)}
.dy .dnum{font-size:clamp(12px,min(1.35vw,2.5vh),22px);font-weight:800;letter-spacing:-.03em}
.dy .di{font-size:clamp(8.5px,min(.9vw,1.7vh),13px);color:var(--dim);font-weight:600;
  line-height:1.3;padding:.08vw 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dy .di b{color:var(--ink);font-weight:700}
.dy .di.money{color:var(--red)}
.dy .di.shape{font-style:italic;opacity:.72}
.dy .di.none{color:var(--faint);font-style:italic}
.empty{font-size:clamp(11px,min(1.2vw,2.2vh),18px);color:var(--faint);font-weight:600;
  padding:.8vw 0;line-height:1.5}

/* ── SCN-03 · THIS WEEK. an index, not a list. ───────────────────────────── */
.week{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.wk{display:grid;grid-template-columns:auto 1fr;gap:.55vw;align-items:baseline;
  padding:.3vw 0;border-bottom:1px solid var(--rule2)}
.wk .d{width:.45vw;height:.45vw;min-width:6px;min-height:6px;border-radius:50%;
  background:var(--faint);align-self:center}
.wk .t{font-size:clamp(10px,min(1.08vw,2vh),16px);font-weight:600;line-height:1.25;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.more{font-size:clamp(8.5px,min(.9vw,1.7vh),13px);color:var(--faint);font-weight:700;padding-top:.3vw}

/* ── SCN-04 · REMINDERS. a rail with live countdowns. ────────────────────── */
.rem{position:relative;flex:1;min-height:0;overflow:hidden;padding-left:1.2vw;margin-top:.2vw}
.rem::before{content:"";position:absolute;left:.3vw;top:.3vw;bottom:.3vw;width:1px;
  background:linear-gradient(180deg,var(--blue),rgba(63,95,122,.1))}
.rn{position:relative;padding:.32vw 0;border-bottom:1px solid var(--rule2)}
.rn::before{content:"";position:absolute;left:-1.05vw;top:.62vw;width:.42vw;height:.42vw;
  min-width:6px;min-height:6px;border-radius:50%;background:var(--card);
  border:2px solid var(--blue)}
.rn .rt{font-size:clamp(10px,min(1.05vw,1.95vh),16px);font-weight:700;line-height:1.2;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rn .rw{font-size:clamp(8.5px,min(.9vw,1.7vh),12.5px);color:var(--dim);font-weight:700;
  font-family:"JetBrains Mono",monospace}
.rn .rw b{color:var(--blue)}
.rn.past{opacity:.42}

/* ── SCN-05 · STILL UNANSWERED. margin notes. ────────────────────────────── */
.open{flex-shrink:0;border-top:1px solid var(--rule);padding-top:.4vw;margin-top:.3vw}
.oi{font-size:clamp(9px,min(.98vw,1.85vh),14px);color:var(--dim);font-weight:600;
  padding:.16vw 0 .16vw .7vw;border-left:2px dashed var(--gold);line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── SCN-06 · how this list is fed ───────────────────────────────────────── */
.foot{flex-shrink:0;border-top:2px solid var(--ink);padding-top:.45vw;display:flex;
  gap:1.6vw;align-items:baseline;flex-wrap:wrap;
  font-size:clamp(9px,min(.98vw,1.85vh),14px);color:var(--dim);font-weight:600}
.foot b{color:var(--ink);font-weight:800}
.foot code{font-family:"JetBrains Mono",monospace;background:var(--card2);
  border:1px solid var(--rule);border-radius:3px;padding:.08em .4em;color:var(--ink)}

@media (max-width:1000px){
  :root{--safe:16px;--gap:14px}
  html,body{overflow:auto;height:auto}
  #board{height:auto;min-height:100%}
  .head{grid-template-columns:1fr;gap:8px} .headright{text-align:left}
  .refresh{justify-content:flex-start}
  .body{grid-template-columns:1fr;grid-template-rows:none}
  .col{overflow:visible}
  .agenda{padding-top:12px}
  .days{grid-template-columns:repeat(2,1fr);gap:10px}
  .dy{border-left:none;border-top:1px solid var(--rule2);padding:8px 0;overflow:visible}
  .dy .di{white-space:normal}
  .title{font-size:28px} .tk .t{font-size:17px} .wk .t,.rn .rt{font-size:15px}
  .oi{font-size:13.5px;white-space:normal}
  .rem{padding-left:20px} .rem::before{left:4px}
  .rn::before{left:-17px;top:11px;width:8px;height:8px}
  .foot{flex-direction:column;gap:6px}
  .hq-sample #board{padding-bottom:130px}
}
</style>
</head>
<body>

<main id="board">

  <!-- SCN-01 · MASTHEAD -->
  <header class="head">
    <div>
      <div class="eyebrow mono">the board</div>
      <div class="title" id="title">today <em id="titleSub"></em></div>
      <div class="dateline" id="dateline">&nbsp;</div>
    </div>
    <div class="headright">
      <div class="count" id="count">&nbsp;</div>
      <div class="refresh mono" id="refresh">&nbsp;</div>
    </div>
  </header>

  <div class="body">

    <!-- SCN-02 · TODAY -->
    <section class="col">
      <div class="colhead"><span class="eyebrow mono">scn-02 · today</span>
        <span class="eyebrow mono" style="color:var(--faint)" id="todayAge"></span></div>
      <div class="today" id="today"></div>
    </section>

    <!-- SCN-03 · THIS WEEK -->
    <section class="col">
      <div class="colhead"><span class="eyebrow mono">scn-03 · this week</span>
        <span class="eyebrow mono" style="color:var(--faint)" id="weekCount"></span></div>
      <div class="week" id="week"></div>
      <div class="more mono" id="weekMore"></div>

      <div class="colhead" style="margin-top:.6vw"><span class="eyebrow mono">scn-05 · still unanswered</span></div>
      <div class="open" id="open" style="border-top:none;padding-top:.2vw"></div>
    </section>

    <!-- SCN-04 · REMINDERS -->
    <section class="col">
      <div class="colhead"><span class="eyebrow mono">scn-04 · reminders</span>
        <span class="eyebrow mono" style="color:var(--faint)" id="remCount"></span></div>
      <div class="rem" id="rem"></div>
    </section>

    <!-- SCN-07 · THE SEVEN DAY AGENDA -->
    <section class="agenda">
      <div class="colhead" style="border-bottom:none;padding-bottom:0">
        <span class="eyebrow mono">scn-07 · the next seven days</span>
        <span class="eyebrow mono" style="color:var(--faint)" id="agendaNote"></span>
      </div>
      <div class="days" id="days"></div>
    </section>
  </div>

  <!-- SCN-06 · HOW THIS IS FED -->
  <div class="foot" id="foot"></div>
</main>

<!-- data.local.js is his real numbers. it is gitignored and is missing on a fresh
     clone, where this tag 404s harmlessly and the committed sample below takes over. -->
<script src="data.local.js"></script>
<script src="data.js"></script>
<script src="hq-core.js"></script>
<script>
"use strict";

function render(){
  var D = HQ.data();
  var n = new Date();
  var todos = D.todos || [];
  var today = todos.filter(function(t){ return t.when === "today"; });
  var week  = todos.filter(function(t){ return t.when === "this week"; });
  var tf = HQ.fresh("todo");

  document.getElementById("titleSub").textContent =
    n.toLocaleDateString(undefined,{weekday:"long"}).toLowerCase();
  document.getElementById("dateline").textContent =
    n.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"}).toLowerCase();
  document.getElementById("count").innerHTML =
    '<u>' + today.length + '</u> today · ' + week.length + ' this week';
  document.getElementById("todayAge").textContent = tf.state === "unknown" ? "no source" : tf.age;

  /* ── SCN-02 ──────────────────────────────────────────────────────────── */
  var el = document.getElementById("today");
  if (!today.length){
    el.innerHTML = '<div class="empty">Nothing is marked for today. That is either a good ' +
      'day or a list that has not been updated. Say "add to my to do list" in any Claude ' +
      'session and it lands here.</div>';
  } else {
    var show = today.slice(0,5);
    el.innerHTML = show.map(function(t,i){
      var hot = /pay|late|overdue|bill/i.test(t.text);
      return '<div class="tk' + (hot ? " hot" : "") + '">' +
        '<span class="n">' + String(i+1).padStart(2,"0") + '</span>' +
        '<span class="t">' + HQ.esc(t.text) + '</span>' +
        '<span class="a">' + HQ.esc(t.area || "") + '</span></div>';
    }).join("") + (today.length > show.length
      ? '<div class="more mono">and ' + (today.length - show.length) + ' more marked today</div>' : "");
  }

  /* the to do list is usually short, and round 1 left the rest of this column as
     bare cream. what actually belongs under a day's to do list on a paper agenda
     is that day's appointments, so they go here. */
  var onBooks = (D.events||[]).map(function(e){
      return {t:e.title, s:new Date(e.start), real:!!e.real}; })
    .filter(function(e){ return !isNaN(e.s) && e.s.toDateString() === n.toDateString(); })
    .sort(function(a,b){ return a.s - b.s; });
  el.innerHTML += '<div class="colhead" style="margin-top:.7vw">' +
    '<span class="eyebrow mono">on the books today</span>' +
    '<span class="eyebrow mono" style="color:var(--faint)">' + onBooks.length + '</span></div>' +
    (onBooks.length
      ? onBooks.slice(0,4).map(function(e){
          return '<div class="wk"><span class="d"></span><span class="t' +
            (e.real ? "" : '" style="font-style:italic;opacity:.72') + '"><b>' +
            HQ.clockOf(e.s) + '</b> ' + HQ.esc(e.t) + '</span></div>'; }).join("") +
        (onBooks.length > 4 ? '<div class="more mono">and ' + (onBooks.length-4) +
          ' more today</div>' : "")
      : '<div class="more mono">nothing, as far as HQ knows. no calendar is connected.</div>');

  /* ── SCN-03 ──────────────────────────────────────────────────────────── */
  document.getElementById("weekCount").textContent = week.length;
  var wShow = week.slice(0,7);
  document.getElementById("week").innerHTML = week.length
    ? wShow.map(function(t){
        return '<div class="wk"><span class="d"></span><span class="t">' + HQ.esc(t.text) +
          '</span></div>'; }).join("")
    : '<div class="empty" style="font-size:inherit">nothing else marked this week</div>';
  document.getElementById("weekMore").textContent = week.length > wShow.length
    ? "and " + (week.length - wShow.length) + " more this week" : "";

  /* ── SCN-04 · reminders. countdowns computed, never stored. ──────────── */
  var rems = (D.reminders || []).map(function(r){
    return { t:r.text, at:new Date(r.at), repeat:r.repeat, src:r.source };
  }).filter(function(r){ return !isNaN(r.at); })
    .sort(function(a,b){ return a.at - b.at; });
  document.getElementById("remCount").textContent = rems.length;
  var rEl = document.getElementById("rem");
  if (!rems.length){
    rEl.innerHTML = '<div class="empty">no reminders are set. these come from HQ, ' +
      'the same way the to do list does.</div>';
  } else {
    var rShow = rems.slice(0,6);
    rEl.innerHTML = rShow.map(function(r){
      /* Round 1 built the string first and then called Math.abs on it, so every
         reminder printed "passed NaN ago". One shared helper now, not five copies
         of the same ternary. */
      var past = r.at < n;
      var when = HQ.gapText(r.at - n);
      return '<div class="rn' + (past ? " past" : "") + '">' +
        '<div class="rt">' + HQ.esc(r.t) + '</div>' +
        '<div class="rw"><b>' + when + '</b> · ' + HQ.clockOf(r.at) +
        (r.repeat ? " · " + HQ.esc(r.repeat) : "") + '</div></div>';
    }).join("") + (rems.length > rShow.length
      ? '<div class="more mono">and ' + (rems.length - rShow.length) + ' more</div>' : "");
  }

  /* ── SCN-05 ──────────────────────────────────────────────────────────── */
  var wbAll = D.whiteboard || [], wbShow = wbAll.slice(0,4);
  document.getElementById("open").innerHTML =
    wbShow.map(function(w){ return '<div class="oi">' + HQ.esc(w) + '</div>'; }).join("") +
    (wbAll.length > wbShow.length
      ? '<div class="more mono">and ' + (wbAll.length - wbShow.length) + ' more in HQ</div>' : "");

  /* ── SCN-07 · the seven day agenda. what filled the empty half of the page ── */
  var DOW = ["sun","mon","tue","wed","thu","fri","sat"];
  var evAll = (D.events||[]).map(function(e){
    return {t:e.title, s:new Date(e.start), real:!!e.real}; })
    .filter(function(e){ return !isNaN(e.s); });
  var billAll = (D.bills||[]).filter(function(b){ return !b.paid; })
    .concat((D.subscriptions||[]).map(function(s){
      return {name:s.name, due:s.renews, amount:s.amount, sample:s.sample}; }));
  var anyShape = false;
  var daysHtml = "";
  for (var i = 0; i < 7; i++){
    var dt = new Date(); dt.setDate(dt.getDate() + i);
    var key = dt.toDateString();
    var dayEvs = evAll.filter(function(e){ return e.s.toDateString() === key; })
                      .sort(function(a,b){ return a.s - b.s; });
    var dayMoney = billAll.filter(function(b){ return HQ.daysFromToday(b.due) === i; });
    var items = dayEvs.slice(0,3).map(function(e){
      if (!e.real) anyShape = true;
      return '<div class="di' + (e.real ? "" : " shape") + '"><b>' + HQ.clockOf(e.s) + '</b> ' +
        HQ.esc(e.t) + '</div>'; });
    items = items.concat(dayMoney.slice(0,2).map(function(b){
      return '<div class="di money">' + (HQ.money(b.amount) || "?") + ' ' +
        HQ.esc(b.name) + '</div>'; }));
    var hidden = (dayEvs.length + dayMoney.length) - items.length;
    if (!items.length) items = ['<div class="di none">clear</div>'];
    else if (hidden > 0) items.push('<div class="di none">and ' + hidden + ' more</div>');
    daysHtml += '<div class="dy' + (i === 0 ? " today" : "") + '">' +
      '<div class="dh"><span class="dow">' + DOW[dt.getDay()] + '</span>' +
      '<span class="dnum">' + dt.getDate() + '</span></div>' + items.join("") + '</div>';
  }
  document.getElementById("days").innerHTML = daysHtml;
  document.getElementById("agendaNote").textContent = anyShape
    ? "italic entries are shapes, no calendar is connected"
    : "from the calendar";

  /* ── SCN-06 · how the list is fed. the one instruction worth repeating. ─ */
  document.getElementById("foot").innerHTML =
    'say <b>"add to my to do list"</b> in any Claude session' +
    ' &nbsp;·&nbsp; the file behind this screen is <code>life/TODO.md</code>' +
    ' &nbsp;·&nbsp; only <b>today</b> and <b>this week</b> reach a screen' +
    (D.todo_note ? ' &nbsp;·&nbsp; <span style="color:var(--red)">' + HQ.esc(D.todo_note) + '</span>' : '');
}

HQ.boot(render);
HQ.refreshLine(document.getElementById("refresh"));
setTimeout(function(){
  var el = document.getElementById("today");
  if (el && !el.innerHTML.trim())
    el.innerHTML = '<div class="empty">data did not load. run python3 make-data.py in this folder.</div>';
}, 2500);
</script>
</body>
</html>
